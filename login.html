<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1fp7rNNDhc1YAdPjNuqaSDXLDjKlTA"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>PCCraft - Вход</title>
    <style>
      :root {
        --bg-primary: #1a1a1a;
        --bg-secondary: #262626;
        --bg-secondary-hover: #2e2e2e;
        --border-color: #404040;
        --text-primary: #e0e0e0;
        --text-black: #1a1a1a;
        --text-secondary: #a3a3a3;
        --primary: #4caf50;
        --primary-hover: #66bb6a;
        --accent: #cf6679;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
      }

      .login-wrapper {
        min-height: calc(100vh - 88px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px 16px;
      }

      /* Typography */
      .heading-lg {
        font-size: 28px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.5px;
        color: var(--text-primary);
      }

      .text-secondary-custom {
        color: var(--text-secondary) !important;
      }

      /* Buttons */
      .btn-primary-custom {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        border-radius: 8px;
        padding: 0 24px;
        font-weight: 600;
        font-size: 14px;
        background-color: var(--primary);
        color: var(--text-black);
        border: none;
        cursor: pointer;
        transition: background-color 0.2s;
        text-decoration: none;
      }

      .btn-primary-custom:hover {
        background-color: var(--primary-hover);
        color: var(--text-black);
      }

      /* Form */
      .login-form {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        background-color: var(--bg-secondary);
        padding: 32px;
      }

      .form-fields {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-label {
        font-size: 14px;
        color: var(--text-primary);
      }

      .form-input {
        width: 100%;
        height: 48px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background-color: var(--bg-secondary);
        padding: 0 16px;
        font-size: 14px;
        color: var(--text-primary);
        outline: none;
        transition: border-color 0.2s;
      }

      .form-input::placeholder {
        color: var(--text-secondary);
      }

      .form-input:focus {
        border-color: var(--primary);
      }

      .form-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .link-primary {
        color: var(--primary);
        font-size: 12px;
        text-decoration: none;
        transition: color 0.2s;
      }

      .link-primary:hover {
        color: var(--primary-hover);
      }

      .register-link {
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <main class="login-wrapper">
      <form class="login-form">
        <!-- Заголовок формы -->
        <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 16px;">
          <img src="/icons/PersonIcon.svg" alt="" width="32" height="32" />
          <h2 class="heading-lg">Войти в аккаунт</h2>
          <p class="text-secondary-custom" style="max-width: 240px; font-size: 14px;">
            Сохраняйте сборки и следите за заказами.
          </p>
        </div>

        <!-- Поля формы -->
        <div class="form-fields">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-input"
              id="email"
              placeholder="you@example.com"
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Пароль</label>
            <input
              type="password"
              class="form-input"
              id="password"
              placeholder="Введите пароль"
            />
          </div>
        </div>

        <!-- Опции формы -->
        <div class="form-options">
          <a href="#" class="link-primary">Забыли пароль?</a>
        </div>

        <button type="submit" class="btn-primary-custom w-100">
          Войти
        </button>

        <!-- Ссылка на регистрацию -->
        <p class="register-link">
          <span class="text-secondary-custom">Нет аккаунта?</span>
          <a href="#" class="link-primary">Зарегистрироваться</a>
        </p>
      </form>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
